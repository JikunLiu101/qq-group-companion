apiVersion: v1
kind: Plugin
metadata:
  author: JikunLiu101
  name: qq-group-companion
  repository: https://github.com/JikunLiu101/qq-group-companion
  version: 0.10.0
  description:
    en_US: 'Lets an AI persona hang out in QQ groups like a regular member: listens to whitelisted groups, turns stickers and images into text, and decides when the persona should speak, with per-user and per-group limits. OneBot v11 (e.g. NapCat).'
    zh_Hans: 让 AI 人设像普通群友一样待在 QQ 群里：只旁听白名单群，把表情包和图片转成文字，并决定人设什么时候开口，带每人、每群次数限制。适用于 OneBot v11（如 NapCat）。
  label:
    en_US: QQ Group Companion
    zh_Hans: QQ 群聊陪伴
  icon: assets/icon.svg
spec:
  config:
  - name: group-whitelist
    label:
      en_US: '[Basics] Group whitelist'
      zh_Hans: '[基础] 群白名单'
    description:
      en_US: QQ group numbers to listen to, separated by commas, e.g. 123456789,987654321. Empty = listen to no group. Also route only these groups to the pipeline in the bot's event routing (see README).
      zh_Hans: 要旁听的 QQ 群号，用英文逗号分隔，例如 123456789,987654321。留空 = 一个群都不听。建议同时在 LangBot 机器人的事件路由里只放行这些群（见 README）。
    type: string
    required: false
    default: ''
  - name: data-dir
    label:
      en_US: '[Basics] Data directory'
      zh_Hans: '[基础] 数据目录'
    description:
      en_US: Absolute local path, e.g. D:\langbot-data\qq-companion. Holds the chat buffer companion.db (kept 14 days) and the decision log decisions.log. Keep it out of synced folders such as OneDrive.
      zh_Hans: 本机绝对路径，例如 D:\langbot-data\qq-companion。存放聊天缓冲 companion.db（保留 14 天）和判断记录 decisions.log。不要放在 OneDrive 等同步盘里。
    type: string
    required: true
    default: ''
  - name: reply-mode
    label:
      en_US: '[Basics] Reply mode'
      zh_Hans: '[基础] 回复模式'
    description:
      en_US: Listen only = record, never reply (use it first to check that messages are recorded). Reply when mentioned = reply only when someone calls the bot; requires the gate secret below.
      zh_Hans: 只旁听 = 只记录，从不回复（建议先用它确认消息能正常记录）；点名回复 = 有人叫她时才回复，需要先设好下面的"放行暗号密钥"。
    type: select
    required: true
    default: listen
    options:
    - name: listen
      label:
        en_US: Listen only
        zh_Hans: 只旁听
    - name: mention
      label:
        en_US: Reply when mentioned
        zh_Hans: 点名回复
  - name: self-qq
    label:
      en_US: '[Basics] Bot QQ number'
      zh_Hans: '[基础] 机器人 QQ 号'
    description:
      en_US: The QQ number the bot is logged in with. Used to recognise "@bot" and "reply to the bot". Required in reply mode.
      zh_Hans: 机器人登录的 QQ 号，用来识别"@机器人"和"回复机器人的消息"。点名回复模式下必填。
    type: string
    required: false
    default: ''
  - name: log-level
    label:
      en_US: '[Basics] Log level'
      zh_Hans: '[基础] 日志级别'
    description:
      en_US: Plugin logs are shown on the plugin detail page in LangBot. INFO records every pass, reply and problem; switch to DEBUG when troubleshooting (logs the decision for every message).
      zh_Hans: 插件日志在 LangBot 的插件详情页里查看。INFO 记录每次放行、回复和异常；排查问题时改成 DEBUG（会记录每条消息的判断过程）。
    type: select
    required: false
    default: INFO
    options:
    - name: DEBUG
      label:
        en_US: DEBUG (most detail)
        zh_Hans: DEBUG（最详细）
    - name: INFO
      label:
        en_US: INFO
        zh_Hans: INFO
    - name: WARNING
      label:
        en_US: WARNING (problems only)
        zh_Hans: WARNING（只看问题）
    - name: ERROR
      label:
        en_US: ERROR (needs action)
        zh_Hans: ERROR（需要处理的）
  - name: persona-name
    label:
      en_US: '[Mentions] Persona name'
      zh_Hans: '[点名] 人设名字'
    description:
      en_US: The persona's name, e.g. "Helper". Used instead of the bot's QQ number in the chat log; mentioning it counts as a "weak mention" (just saying the name, not necessarily calling the bot).
      zh_Hans: 人设的名字，例如"小助手"。聊天记录里用它代替机器人的 QQ 号；群友在消息里提到它算"弱点名"（只是提到名字，不一定在叫她）。
    type: string
    required: false
    default: ''
  - name: persona-aliases
    label:
      en_US: '[Mentions] Aliases'
      zh_Hans: '[点名] 别名'
    description:
      en_US: Other names that also count as calling the bot, comma separated, e.g. Claude,Helper. Case-insensitive; single-character names are ignored (too easy to trigger). Counts as a weak mention.
      zh_Hans: 其他也算在叫她的称呼，英文逗号分隔，例如 Claude,小助手。不分大小写；只有一个字的称呼会被忽略（太容易误触）。提到别名算弱点名。
    type: string
    required: false
    default: ''
  - name: nickname-as-alias
    label:
      en_US: '[Mentions] Group nickname counts too'
      zh_Hans: '[点名] 群昵称也算点名'
    description:
      en_US: Looks up the bot's current group card / nickname in each group; mentioning it counts as a weak mention. A renamed nickname is picked up within one refresh interval.
      zh_Hans: 自动查询机器人在每个群当前的群名片 / 昵称，群友提到它也算弱点名。改了群昵称，最多一个刷新间隔后就会跟上。
    type: boolean
    required: false
    default: true
  - name: nickname-refresh-minutes
    label:
      en_US: '[Mentions] Nickname refresh (minutes)'
      zh_Hans: '[点名] 群昵称刷新间隔（分钟）'
    description:
      en_US: How often to look up the bot's group nickname again.
      zh_Hans: 多久重新查询一次机器人的群昵称。
    type: integer
    required: false
    default: 10
    show_if:
      field: nickname-as-alias
      operator: eq
      value: true
  - name: owner-qq
    label:
      en_US: '[Mentions] Owner QQ number'
      zh_Hans: '[点名] 主人 QQ 号'
    description:
      en_US: QQ number of the owner (the person who runs the bot). The owner's messages are marked "(owner)" in the context sent to the model.
      zh_Hans: 主人（维护这个机器人的人）的 QQ 号。主人的发言在给模型的上下文里会标成"（主人）"。
    type: string
    required: false
    default: ''
  - name: owner-aliases
    label:
      en_US: '[Mentions] Owner nicknames'
      zh_Hans: '[点名] 主人的称呼'
    description:
      en_US: The owner's nicknames, comma separated. Others mentioning them is a weak mention, so the persona can speak up for the owner; the owner saying them doesn't count.
      zh_Hans: 主人的绰号，英文逗号分隔。群友提到这些称呼算弱点名，人设可以出来替主人说话；主人自己说不算。
    type: string
    required: false
    default: ''
  - name: gate-secret
    label:
      en_US: '[Gate] Gate secret'
      zh_Hans: '[放行] 放行暗号密钥'
    description:
      en_US: A random string of at least 16 characters. When the plugin decides to answer a message it prepends a "gate marker" signed with this secret; the pipeline's group respond rule only accepts that marker, so nothing the plugin didn't approve reaches the model. Once set, the plugin log prints what to put into the pipeline's Trigger → group respond rules → regexp (or run tools/gate_regexp.py). Empty = no replies; the log suggests a random secret.
      zh_Hans: 至少 16 位的随机字符串。插件决定回复一条消息时，会在消息开头加一段用它签名的"放行暗号"；流水线的群响应规则只认这个暗号，所以没经过插件判断的消息到不了模型。设好后，插件日志会打印流水线"触发 → 群响应规则 → 正则"该填的内容（也可以运行 tools/gate_regexp.py 算）。留空时不会回复，日志里会给出一个随机密钥供参考。
    type: secret
    required: false
    default: ''
    show_if: &id001
      field: reply-mode
      operator: eq
      value: mention
  - name: user-daily-strong-limit
    label:
      en_US: '[Limits] Strong mentions per user per day'
      zh_Hans: '[限额] 每人每日强点名次数'
    description:
      en_US: Strong mention = someone @-mentions the bot or replies to its message. Each user gets this many per day; after that the plugin sends one "over-limit reply" (once per user per day) and ignores the rest of the day.
      zh_Hans: 强点名 = 有人 @机器人，或者回复机器人的消息。每人每天最多放行这么多次，超过后插件回一句"超额话术"（每人每天只回一次），当天再叫就不理。
    type: integer
    required: false
    default: 20
    show_if: *id001
  - name: over-limit-replies
    label:
      en_US: '[Limits] Over-limit replies'
      zh_Hans: '[限额] 超额话术'
    description:
      en_US: One per line, picked at random; {n} becomes the daily limit. Empty = built-in lines.
      zh_Hans: 每行一条，随机选一句；{n} 会替换成每日次数。留空使用内置话术。
    type: text
    required: false
    default: ''
    show_if: *id001
  - name: weak-per-minute
    label:
      en_US: '[Limits] Weak mentions per group per minute'
      zh_Hans: '[限额] 每群每分钟弱点名次数'
    description:
      en_US: Weak mention = the message contains the bot's name, alias, group nickname or the owner's nickname (messages that @ or reply to someone else don't count). At most this many pass per group per minute; the rest are ignored. The model still decides whether it was really being addressed.
      zh_Hans: 弱点名 = 消息里提到她的名字、别名、群昵称或主人的称呼（@别人、回复别人的消息不算）。每个群每分钟最多放行这么多次，多出来的直接忽略。放行后模型还会判断是不是真在叫她。
    type: integer
    required: false
    default: 3
    show_if: *id001
  - name: daily-limit-per-group
    label:
      en_US: '[Limits] Replies per group per day'
      zh_Hans: '[限额] 每群每日回复上限'
    description:
      en_US: 'Safety cap: at most this many replies per group (or private chat) per day, including over-limit and error replies.'
      zh_Hans: 兜底保护：每个群（或私聊）每天最多回复多少条，包括超额话术和出错话术。
    type: integer
    required: false
    default: 100
    show_if: *id001
  - name: daily-limit-total
    label:
      en_US: '[Limits] Replies per day in total'
      zh_Hans: '[限额] 全部每日回复上限'
    description:
      en_US: 'Safety cap: at most this many replies per day across all groups and private chats.'
      zh_Hans: 兜底保护：所有群和私聊合计每天最多回复多少条。
    type: integer
    required: false
    default: 300
    show_if: *id001
  - name: context-max-messages
    label:
      en_US: '[Replies] Context messages'
      zh_Hans: '[回复] 附带的聊天条数上限'
    description:
      en_US: At most this many recent messages are sent to the model with each request. More context costs more tokens.
      zh_Hans: 每次交给模型的最近聊天最多多少条。越多越懂上下文，也越费 token。
    type: integer
    required: false
    default: 40
    show_if: *id001
  - name: context-window-minutes
    label:
      en_US: '[Replies] Context window (minutes)'
      zh_Hans: '[回复] 附带聊天的时间范围（分钟）'
    description:
      en_US: Only messages from the last N minutes are included.
      zh_Hans: 只附带这么多分钟以内的聊天。
    type: integer
    required: false
    default: 120
    show_if: *id001
  - name: max-reply-chars
    label:
      en_US: '[Replies] Max reply length'
      zh_Hans: '[回复] 单条回复最大字数'
    description:
      en_US: Replies longer than this are cut.
      zh_Hans: 回复超过这么多字会被截断。
    type: integer
    required: false
    default: 300
    show_if: *id001
  - name: reply-delay-min-seconds
    label:
      en_US: '[Replies] Random delay – min (s)'
      zh_Hans: '[回复] 回复前随机等待·最短（秒）'
    description:
      en_US: 'Wait a random few seconds before sending, like a person typing. The plugin sends replies itself: it quotes the original message only when @-mentioned or replied to. The pipeline''s "force delay" and "quote origin" only apply if the plugin fails and LangBot sends instead.'
      zh_Hans: 回复前随机等几秒再发，像真人打字。回复由插件自己发送：群里被 @ 或被回复时引用原消息，其他情况直接发。流水线里的"强制延迟"和"引用原消息"只在插件发送失败、退回 LangBot 发送时才起作用。
    type: integer
    required: false
    default: 3
    show_if: *id001
  - name: reply-delay-max-seconds
    label:
      en_US: '[Replies] Random delay – max (s)'
      zh_Hans: '[回复] 回复前随机等待·最长（秒）'
    description:
      en_US: See above.
      zh_Hans: 见上一项。
    type: integer
    required: false
    default: 12
    show_if: *id001
  - name: private-whitelist
    label:
      en_US: '[Replies] Private chat whitelist (QQ numbers)'
      zh_Hans: '[回复] 私聊白名单（QQ 号）'
    description:
      en_US: QQ numbers allowed to chat with the bot privately, comma separated (usually just the owner, to check the whole chain). Every private message from them is answered and doesn't use the daily quota. You also need a private-chat route for them in the bot's event routing (see README). Other private chats, including other platforms, are left untouched.
      zh_Hans: 允许私聊她的 QQ 号，英文逗号分隔（通常只填主人，用来检查整条链路是否正常）。这些人的私聊每条都会回复，不占每人每天的次数。还需要在 LangBot 机器人的事件路由里给这些人加私聊路由（见 README）。其他私聊（包括其他平台的私聊）插件不处理。
    type: string
    required: false
    default: ''
    show_if: *id001
  - name: error-replies-limit
    label:
      en_US: '[Errors] Reply when out of quota'
      zh_Hans: '[出错] 额度用完时的话术'
    description:
      en_US: Sent when the runner reports a quota lock (outputs <qgc-error kind="limit"/>). Needs a runner wrapper that turns errors into this tag, e.g. the claude-usage-guard plugin (see README). One per line, picked at random; empty = built-in lines.
      zh_Hans: Runner 报告"额度用完 / 被锁定"（输出 <qgc-error kind="limit"/>）时回的话。需要一个把错误转换成这个标记的 Runner 包装命令，例如 claude-usage-guard 插件（见 README）。每行一条，随机选一句；留空使用内置话术。
    type: text
    required: false
    default: ''
    show_if: *id001
  - name: error-replies-refused
    label:
      en_US: '[Errors] Reply when the model refuses'
      zh_Hans: '[出错] 安全拒答时的话术'
    description:
      en_US: Sent when the model's safety system refuses (kind="refused"). One per line; empty = built-in lines.
      zh_Hans: 模型的安全机制拒绝回答（kind="refused"）时回的话。每行一条；留空使用内置话术。
    type: text
    required: false
    default: ''
    show_if: *id001
  - name: error-replies-other
    label:
      en_US: '[Errors] Reply on other errors'
      zh_Hans: '[出错] 其他错误时的话术'
    description:
      en_US: Sent on other errors (network, timeout …, kind="other"). One per line; empty = built-in lines.
      zh_Hans: 其他错误（网络、超时等，kind="other"）时回的话。每行一条；留空使用内置话术。
    type: text
    required: false
    default: ''
    show_if: *id001
  - name: error-reply-weak
    label:
      en_US: '[Errors] Also reply on weak mentions'
      zh_Hans: '[出错] 弱点名出错时也回话术'
    description:
      en_US: 'Off (default): only strong mentions (@ or reply) get an error reply; weak mentions stay silent.'
      zh_Hans: 关闭（默认）：只有强点名（@她、回复她）出错时才回话术，弱点名出错时不说话。
    type: boolean
    required: false
    default: false
    show_if: *id001
  - name: error-cooldown-minutes
    label:
      en_US: '[Errors] Error reply cooldown (minutes)'
      zh_Hans: '[出错] 出错话术冷却（分钟）'
    description:
      en_US: At most one error reply per group (or private chat) within this time, so a quota lock doesn't flood the chat.
      zh_Hans: 同一个群（或私聊）在这段时间内最多回一次出错话术，避免额度用完时刷屏。
    type: integer
    required: false
    default: 10
    show_if: *id001
  - name: vision-enabled
    label:
      en_US: '[Media] Let the model see images'
      zh_Hans: '[媒体] 允许看图'
    description:
      en_US: 'When on, images in the message being answered are downloaded to the inbox directory (only from Tencent image hosts) and their paths are given to the model to open with its Read tool. Important: restrict the runner so it can only read the inbox directory.'
      zh_Hans: 开启后，要回复的那条消息里的图片会下载到 inbox 目录（只从腾讯图片服务器下载），并把文件路径告诉模型，让它用 Read 工具查看。注意：Runner 必须只允许读取 inbox 目录，否则模型可能读到别的文件。
    type: boolean
    required: false
    default: false
    show_if: *id001
  - name: inbox-dir
    label:
      en_US: '[Media] Image inbox directory'
      zh_Hans: '[媒体] 图片 inbox 目录'
    description:
      en_US: Where images are saved (absolute path), usually "inbox" under the runner's working directory.
      zh_Hans: 图片保存目录（绝对路径），通常是 Runner 工作目录下的 inbox。
    type: string
    required: false
    default: ''
    show_if:
      field: vision-enabled
      operator: eq
      value: true
  - name: max-images
    label:
      en_US: '[Media] Max images per message'
      zh_Hans: '[媒体] 每次最多看几张图'
    description:
      en_US: Images beyond this count in one message are skipped.
      zh_Hans: 一条消息里超过这个数量的图片不下载。
    type: integer
    required: false
    default: 3
    show_if:
      field: vision-enabled
      operator: eq
      value: true
  - name: max-image-mb
    label:
      en_US: '[Media] Max image size (MB)'
      zh_Hans: '[媒体] 单张图片大小上限（MB）'
    description:
      en_US: Larger images are skipped.
      zh_Hans: 超过这个大小的图片不下载。
    type: integer
    required: false
    default: 5
    show_if:
      field: vision-enabled
      operator: eq
      value: true
  - name: inbox-retention-days
    label:
      en_US: '[Media] Keep inbox images (days)'
      zh_Hans: '[媒体] inbox 图片保留天数'
    description:
      en_US: Older images are deleted automatically.
      zh_Hans: 超过这个天数的图片自动删除。
    type: integer
    required: false
    default: 3
    show_if:
      field: vision-enabled
      operator: eq
      value: true
  - name: stickers-enabled
    label:
      en_US: '[Media] Send stickers from a local library'
      zh_Hans: '[媒体] 发本地表情包'
    description:
      en_US: When on, the model can write [表情:tag] in a reply and the plugin sends the matching image from your local sticker library.
      zh_Hans: 开启后，模型可以在回复里写 [表情:标签]，插件换成本地表情库里对应的图片发出。
    type: boolean
    required: false
    default: false
    show_if: *id001
  - name: stickers-dir
    label:
      en_US: '[Media] Sticker directory'
      zh_Hans: '[媒体] 表情库目录'
    description:
      en_US: Sticker directory (absolute path). The file name without extension is the tag, e.g. doge.png → "doge".
      zh_Hans: 表情库目录（绝对路径）。文件名（不含扩展名）就是标签，例如 狗头.png 的标签是"狗头"。
    type: string
    required: false
    default: ''
    show_if:
      field: stickers-enabled
      operator: eq
      value: true
  - name: daily-sticker-limit-per-group
    label:
      en_US: '[Media] Stickers per group per day'
      zh_Hans: '[媒体] 每群每日表情包上限'
    description:
      en_US: At most this many stickers per group per day.
      zh_Hans: 每个群每天最多发多少个表情包。
    type: integer
    required: false
    default: 10
    show_if:
      field: stickers-enabled
      operator: eq
      value: true
  - name: sticker-repeat-minutes
    label:
      en_US: '[Media] Sticker repeat interval (minutes)'
      zh_Hans: '[媒体] 同一表情包不重复间隔（分钟）'
    description:
      en_US: The same sticker isn't sent again within this time.
      zh_Hans: 同一个表情包在这段时间内不会重复发。
    type: integer
    required: false
    default: 30
    show_if:
      field: stickers-enabled
      operator: eq
      value: true
  - name: qq-faces-enabled
    label:
      en_US: '[Media] Send QQ system faces'
      zh_Hans: '[媒体] 发 QQ 系统表情'
    description:
      en_US: When on, the model can write [QQ表情:name] in a reply and the plugin sends the QQ system face.
      zh_Hans: 开启后，模型可以在回复里写 [QQ表情:名字]，插件换成 QQ 系统表情发出。
    type: boolean
    required: false
    default: false
